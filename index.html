</script><script>'use strict';
const $=s=>document.querySelector(s), D=window.TRIP_DATA;
const state={day:0,selecting:false,selected:[],request:0,};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allStops=D.days.flatMap(x=>x.stops), getStop=id=>allStops.find(x=>x.id===id);
const searchLink=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.query);
const directionsLink=(a,b,mode)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a.query)+'&destination='+encodeURIComponent(b.query)+'&travelmode='+(mode==='TRANSIT'?'transit':'walking')+'&hl=ko';
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',2500);}
function render(){
 $('#pages').innerHTML=D.days.map((day,d)=>`<section class="day" aria-label="${esc(day.date)}" aria-hidden="${d!==state.day}" ${d!==state.day?'inert':''}>${day.stops.map(s=>`<article class="stop" data-id="${s.id}"><div class="row"><label class="select-wrap" hidden><input type="checkbox" value="${s.id}" aria-label="${esc(s.time+' '+s.name+' 경로 선택')}"><span></span></label><details><summary>${s.incoming?`<span class="transfer">${esc(s.incoming.mode)} 약 ${s.incoming.mode==='전철'?s.incoming.transit:s.incoming.walk}분 · 계획</span>`:''}<time class="time">${esc(s.time)}</time><span class="title">${esc(s.item)}</span><p class="essential">${esc(s.essential)}</p></summary><div class="more"><p>${esc(s.address)}</p>${s.details.map(x=>`<p>${esc(x)}</p>`).join('')}${s.incoming?`<p>도보 약 ${s.incoming.walk}분 / 대중교통 약 ${s.incoming.transit}분 (계획상 추정)</p><p>${esc(s.incoming.why)}</p>`:''}<a href="${searchLink(s)}" target="_blank" rel="noopener">구글 지도에서 보기</a></div></details></div></article>`).join('')}</section>`).join('');
 $('#dots').innerHTML=D.days.map((d,i)=>`<button aria-label="10월 ${11+i}일" data-day="${i}" aria-current="${i===state.day}"><i></i></button>`).join('');
 $('#dots').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setDay(Number(b.dataset.day));});
 $('#pages').addEventListener('change',e=>{if(e.target.type!=='checkbox')return;const id=e.target.value;if(e.target.checked)state.selected.push(id);else state.selected=state.selected.filter(x=>x!==id);syncSelection();scheduleRoute();});
 $('#pages').addEventListener('click',e=>{const card=e.target.closest('.stop');if(card&&!state.selecting&&!e.target.closest('a'))focusPlace(getStop(card.dataset.id));});
 updateDay();
}
function updateDay(){
 $('#day-count').textContent=`${state.day+1}일차`;
 $('#date').textContent=`10월 ${11+state.day}일`;
 $('#day-note').textContent=['일요일 · 난바','월요일 · 공휴일','화요일 · 귀국'][state.day];
 $('#prev').disabled=state.day===0;$('#next').disabled=state.day===2;
 document.querySelectorAll('#dots button').forEach((b,i)=>b.setAttribute('aria-current',String(i===state.day)));
 document.querySelectorAll('.day').forEach((p,i)=>{p.setAttribute('aria-hidden',String(i!==state.day));p.inert=i!==state.day;});
 history.replaceState(null,'',`#day${state.day+1}`);
 if(!state.selecting)focusPlace(D.days[state.day].stops.find(x=>!['hotel','airport','namba'].includes(x.place))||D.days[state.day].stops[0]);
}
function setDay(i){state.day=Math.max(0,Math.min(2,i));updateDay();$('#pages').scrollTo({left:state.day*$('#pages').clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
let scrollTimer;$('#pages').addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const i=Math.round($('#pages').scrollLeft/$('#pages').clientWidth);if(i!==state.day){state.day=i;updateDay();}},130);});
$('#pages').addEventListener('keydown',e=>{if(e.target!==$('#pages'))return;if(e.key==='ArrowRight'){e.preventDefault();setDay(state.day+1);}if(e.key==='ArrowLeft'){e.preventDefault();setDay(state.day-1);}});
$('#prev').onclick=()=>setDay(state.day-1);$('#next').onclick=()=>setDay(state.day+1);
new ResizeObserver(()=>$('#pages').scrollTo({left:state.day*$('#pages').clientWidth,behavior:'instant'})).observe($('#pages'));
function syncSelection(){document.querySelectorAll('.stop').forEach(el=>{const n=state.selected.indexOf(el.dataset.id);el.classList.toggle('selected',n>=0);el.querySelector('.select-wrap').hidden=!state.selecting;el.querySelector('input').checked=n>=0;el.querySelector('.select-wrap span').textContent=n>=0?n+1:'';});$('#route-toggle').textContent=state.selecting?'해제':'경로 찾기';}
$('#route-toggle').onclick=()=>{state.selecting=!state.selecting;state.selected=[];state.request++;clearTimeout(routeTimer);clearLines();$('#route-results').replaceChildren();syncSelection();if(state.selecting){$('#route-results').innerHTML='<p class="route-status">출발지와 도착지 선택</p>';}else updateDay();};

$('#map-toggle').onclick=()=>{const panel=$('.map-panel');panel.classList.toggle('collapsed');const open=!panel.classList.contains('collapsed');$('#map-toggle').setAttribute('aria-expanded',String(open));$('#map-toggle span').textContent=open?'접기':'펼치기';};
$('#share').onclick=async()=>{if(location.protocol==='file:'||['localhost','127.0.0.1'].includes(location.hostname)){toast('웹에 올린 뒤 링크로 공유할 수 있어요.');return;}try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);toast('링크를 복사했어요.');}}catch(e){if(e.name!=='AbortError')toast('주소창의 링크를 복사해 주세요.');}};
let routeTimer;
function scheduleRoute(){state.request++;clearLines();clearTimeout(routeTimer);$('#route-results').innerHTML='<p class="route-status">'+(state.selected.length<2?'출발지와 도착지 선택':'경로 확인 중…')+'</p>';if(state.selected.length>=2)routeTimer=setTimeout(computeRoute,400);}
function clearLines(){}
function legsForSelection(){return state.selected.slice(1).map((id,i)=>{const a=getStop(state.selected[i]),b=getStop(id);const da=D.days.find(d=>d.stops.includes(a)),db=D.days.find(d=>d.stops.includes(b));const adjacent=da===db&&Math.abs(da.stops.indexOf(b)-da.stops.indexOf(a))===1;const forward=adjacent&&da.stops.indexOf(b)>da.stops.indexOf(a);const ref=forward?b:adjacent?a:null;return {a,b,mode:ref?.mode||((a.place==='airport'||b.place==='airport')?'TRANSIT':'AUTO'),estimate:ref?.incoming||null};});}
async function computeRoute(){
 if(state.selected.length<2)return;
 const legs=legsForSelection();
 $('#route-results').innerHTML='<p class="route-heading">구글 지도 길찾기</p>'+legs.map((x,i)=>`<div class="leg"><strong>${i+1}. ${esc(x.a.name)} → ${esc(x.b.name)}</strong><span class="badge">${x.mode==='TRANSIT'?'대중교통':x.mode==='AUTO'?'이동 수단 비교':'도보'}${x.estimate?' · 약 '+(x.mode==='TRANSIT'?x.estimate.transit:x.estimate.walk)+'분 (계획)':''}</span><br><a href="${directionsLink(x.a,x.b,x.mode==='AUTO'?'WALK':x.mode)}" target="_blank" rel="noopener">${x.mode==='AUTO'?'도보 경로':'구글 지도'} 열기</a>${x.mode==='AUTO'?` · <a href="${directionsLink(x.a,x.b,'TRANSIT')}" target="_blank" rel="noopener">대중교통 경로</a>`:''}</div>`).join('');
}
function focusPlace(s){const frame=$('#map-frame');if(frame)frame.src='https://maps.google.com/maps?q='+encodeURIComponent(s.query)+'&hl=ko&z=16&output=embed';}
const initial=Number(location.hash.match(/day([1-3])/)?.[1]||1)-1;state.day=initial;render();setDay(initial);
if(matchMedia('(max-width:820px)').matches)$('#map-toggle').click();
if(document.modelContext?.registerTool){const lifecycle=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'select_trip_route',description:'Select itinerary stops in the supplied order and show their route. Does not book transport.',inputSchema:{type:'object',properties:{stopIds:{type:'array',items:{type:'string'},minItems:2}},required:['stopIds'],additionalProperties:false},annotations:{readOnlyHint:false},async execute(input){if(!input||!Array.isArray(input.stopIds)||input.stopIds.length<2||new Set(input.stopIds).size!==input.stopIds.length||input.stopIds.some(id=>!getStop(id)))throw Error('Valid distinct itinerary stop IDs required');state.selecting=true;state.selected=[...input.stopIds];syncSelection();await computeRoute();return {selected:state.selected,routeMode:'externalGoogleMaps'};}},{signal:lifecycle.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script></body></html>
